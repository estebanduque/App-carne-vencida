<title>Mi App · prototipo de pantallas</title>
<!--
  PROTOTIPO DESECHABLE. No es la app.

  Sirve para contestar una sola pregunta: ¿se navega mejor con pantallas que con
  menus desplegables? Por eso tiene navegacion y maquetacion de verdad, y datos
  inventados: ni una linea habla con Supabase ni guarda nada.

  A proposito NO registra service worker: el de la app cachea rutas fijas y meter
  otro aca solo traeria confusion de cache.

  Lo unico que hay que mirar de fondo: cuantos toques cuesta llegar a cada cosa,
  si el boton Atras del telefono hace lo que esperas, y si la barra de abajo tiene
  los modulos correctos. Todo lo demas es relleno.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0F1B2D; color: #fff; min-height: 100vh;
    display: flex; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 480px; width: 100%; position: relative; min-height: 100vh; }

  /* La cinta existe para que nunca confundas esto con la app de verdad. */
  .cinta {
    background: #E05A14; color: #fff; font-size: 11px; font-weight: 600;
    text-align: center; padding: 6px 12px; letter-spacing: 0.3px;
    position: sticky; top: 0; z-index: 30;
  }

  /* ---- Cabecera de pantalla ---- */
  .cab {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 16px 10px; position: sticky; top: 27px; z-index: 20;
    background: #0F1B2D;
  }
  .cab-volver {
    width: 36px; height: 36px; flex-shrink: 0; border: none; border-radius: 12px;
    background: rgba(255,255,255,0.07); color: #fff; font-size: 17px;
    font-family: inherit; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .cab-volver:active { background: rgba(255,255,255,0.15); }
  .cab-txt { flex: 1; min-width: 0; }
  .cab h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .cab p { font-size: 13px; color: rgba(255,255,255,0.45); margin-top: 2px; }
  .cab-icono {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }

  /* ---- Cuerpo y transicion entre pantallas ---- */
  main { padding-bottom: 92px; }
  .pantalla { animation: entra 0.26s cubic-bezier(0.22, 0.61, 0.36, 1); }
  .pantalla.atras { animation-name: entraAtras; }
  @keyframes entra      { from { opacity: 0; transform: translateX(22px); } }
  @keyframes entraAtras { from { opacity: 0; transform: translateX(-22px); } }
  @media (prefers-reduced-motion: reduce) { .pantalla { animation: none; } }

  .seccion { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.38);
             padding: 18px 18px 8px; text-transform: uppercase; letter-spacing: 0.6px; }

    background: #1A2D45; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;

  .tarjeta:active { background: #21395a; }
  .tarjeta-txt { flex: 1; min-width: 0; }
  .tarjeta-tit { font-size: 15px; font-weight: 600; }
  .tarjeta-sub { font-size: 12.5px; color: rgba(255,255,255,0.45); margin-top: 3px; }
  .tarjeta-flecha { color: rgba(255,255,255,0.28); font-size: 19px; flex-shrink: 0; }
  .icono {
    width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;

  }
  .pastilla {

    flex-shrink: 0; white-space: nowrap;

// La barra de abajo sale de cuanto tiempo pasa abierto cada modulo: es exactamente

// se ordenaria solo, igual que hoy se ordenan los menus.
// Minutos que pasaste dentro de cada modulo. En la app de verdad esto es uso_modulos,
// que ya lleva la cuenta sola: aca va inventado para poder mostrar el mecanismo.
const USO = { compras: 420, gym: 265, carnes: 150, lentes: 40, ropa: 25 };
const OTROS = ['compras', 'gym', 'carnes', 'lentes', 'ropa'];
// Hoy, Tiempo y Estudio son fijos. El cuarto lugar se lo gana el mas usado de los
// demas, y el resto cae en Mas. Nadie elige esto a mano: cambia solo con el uso.
const POPULAR = OTROS.slice().sort((a, b) => USO[b] - USO[a])[0];
const BARRA = ['inicio', 'tiempo', 'estudio', POPULAR, 'mas'];
const EN_MAS = OTROS.filter(m => m !== POPULAR);
const CORTO = { inicio:'Hoy', tiempo:'Tiempo', estudio:'Estudio', compras:'Compras',
                gym:'Gym', carnes:'Carnes', lentes:'Lentes', ropa:'Ropa', mas:'Más' };
// Un modulo que esta en la barra vuelve a Hoy; uno que vive en Mas, vuelve a Mas.
const volverDe = m => BARRA.includes(m) ? 'inicio' : 'mas';

// ---- El cronometro ----
// Regla: no podes estar haciendo dos cosas a la vez, asi que arrancar algo nuevo
// reemplaza lo que estaba corriendo. La unica excepcion es un viaje en tren, bus o
// avion: el viaje te ocupa el cuerpo pero no la cabeza, y adentro seguis leyendo,
// trabajando o estudiando. Por eso el viaje corre aparte y en paralelo.
let crono = { modulo:'tiempo', etiqueta:'Trabajo › Oficina', color:'#757575', seg: 2467 };
let viaje = null;
const MEDIOS = ['Tren', 'Bus', 'Avión'];

function arrancar(modulo, etiqueta, color){
  crono = { modulo, etiqueta, color, seg: 0 };
  ir('inicio');
}
function pararCrono(){ crono = null; pintar(); }
// Arranca el subtema que la pantalla esta mostrando. Leer de la seleccion evita meter
// texto libre dentro de un onclick, que es donde se rompen las comillas.
function arrancarSub(){
  if(!estTema || !estSub) return;
  arrancar('estudio', estTema.n + ' › ' + estSub.n, estTema.color);
}
function arrancarViaje(medio){
  // Tocar el medio que ya esta corriendo lo termina; tocar otro lo cambia.
  viaje = (viaje && viaje.medio === medio) ? null
        : { medio, etiqueta:'Transporte › ' + medio, color:'#00897B', seg: 0 };
  pintar();
}
const hhmmss = t => [Math.floor(t/3600), Math.floor(t%3600/60), t%60]
  .map(n => String(n).padStart(2, '0')).join(':');

// El reloj de Hoy muestra lo que este corriendo, sea del modulo que sea. Si ademas
// hay un viaje, aparece debajo: son las dos unicas cosas que pueden convivir.
function relojHTML(){
  if(!crono && !viaje){
    return `<div class="crono" style="background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.1);">
      <div class="crono-que" style="margin:0;">Nada corriendo ahora</div>
      <div class="crono-btns">
        <button class="btn fuerte" onclick="ir('tiempo')">▶ Arrancar algo</button>
        <button class="btn" onclick="ir('estudio')">📚 Estudiar</button>
      </div></div>`;
  }
  const principal = crono ? `
    <div class="crono" style="background:${crono.color}1F;border-color:${crono.color}66;">
      <div class="crono-num" id="reloj">${hhmmss(crono.seg)}</div>
      <div class="crono-que">${MODULOS[crono.modulo].ico} ${esc(crono.etiqueta)}</div>
      <div class="crono-btns">
        <button class="btn">⏸ Pausar</button>
        <button class="btn" style="background:${crono.color};" onclick="pararCrono()">■ Terminar</button>
      </div>
    </div>` : `
    <div class="crono" style="background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.1);">
      <div class="crono-que" style="margin:0;">Solo el viaje. No estás cronometrando nada más.</div>
    </div>`;
  const enViaje = viaje ? `
    <div class="crono" style="margin-top:9px;background:rgba(0,137,123,0.12);
         border-color:rgba(0,137,123,0.3);display:flex;align-items:center;gap:12px;text-align:left;">
      <div style="font-size:21px;">🚆</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;"
             id="reloj-viaje">${hhmmss(viaje.seg)}</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px;">
          ${esc(viaje.etiqueta)} · en paralelo</div>
      </div>
      <button class="btn" style="flex:0 0 auto;padding:9px 14px;"
              onclick="arrancarViaje('${viaje.medio}')">■</button>
    </div>` : '';
  return principal + enViaje;
}

// La meta es 8 h por dia habil; la ventaja es lo estudiado menos esa meta.
// Verde si vas adelantado, ambar si vas debiendo. Es tal cual la regla de tu app.
const VENTAJA_SEM = 3.6, VENTAJA_GEN = -12.4;

let estTema = null, estSub = null, estSorteado = null;
const estBloques = new Set([0]);

const horasTema  = t => t.bloques.reduce((a,b)=>a + b.subs.reduce((x,s)=>x+s.hecho,0), 0);
const metaTema   = t => t.bloques.reduce((a,b)=>a + b.subs.reduce((x,s)=>x+s.meta,0), 0);
const horasBloque= b => b.subs.reduce((a,s)=>a+s.hecho,0);
const metaBloque = b => b.subs.reduce((a,s)=>a+s.meta,0);
const hs = h => { const t = Math.round(h*60); const H = Math.floor(t/60), M = t%60;
                  return H ? (M ? H+'h '+String(M).padStart(2,'0') : H+'h') : M+'min'; };
const cumplido = s => s.meta > 0 && s.hecho / s.meta >= 0.9;

// Hasta la meta la barra se llena con el color del tema; lo que sobra se pinta aparte,
// para que el exceso se vea en vez de perderse en un 100% plano. Igual que en la app.
function barra(hecho, meta, color){
  if(!(meta > 0)) return '';
  if(hecho <= meta) return `<div class="barra"><div style="width:${(hecho/meta*100).toFixed(1)}%;background:${color};"></div></div>`;
  const pct = meta / hecho * 100;
  return `<div class="barra"><div style="width:${pct.toFixed(1)}%;background:${color};"></div>
    <div style="width:${(100-pct).toFixed(1)}%;background:#5DCAA5;"></div></div>`;
}
function exceso(hecho, meta){
  return (meta > 0 && hecho > meta) ? ` <span class="listo">+${hs(hecho-meta)}</span>` : '';
}
// Solo entra al sorteo lo que paso el 90%. Si el subtema tiene puntos de repaso
// cargados, se sortea el punto concreto; si no, el subtema entero.
function sorteables(){
  const out = [];
  TEMAS_EST.forEach(t=>t.bloques.forEach(b=>b.subs.forEach(s=>{
    if(!cumplido(s)) return;
    if(s.puntos.length) s.puntos.forEach(p=>out.push({t,b,s,punto:p}));
    else out.push({t,b,s,punto:null});
  })));
  return out;
}
function sortear(){
  const c = sorteables();
  if(!c.length) return;
  const clave = x => x.t.n+'|'+x.s.n+'|'+(x.punto||'');
  const pool = c.length > 1 && estSorteado ? c.filter(x=>clave(x)!==clave(estSorteado)) : c;
  estSorteado = pool[Math.floor(Math.random()*pool.length)];
  pintar();
}
function verTema(n){ estTema = TEMAS_EST.find(t=>t.n===n); estBloques.clear(); estBloques.add(0); ir('estudio/tema'); }
function verSub(ti, bi, si){ estTema = TEMAS_EST[ti]; estSub = estTema.bloques[bi].subs[si]; ir('estudio/subtema'); }
function toggleBloque(i){ estBloques.has(i) ? estBloques.delete(i) : estBloques.add(i); pintar(); }

      <div style="display:flex;flex-direction:column;align-items:center;padding:20px 0 6px;">
        <div style="position:relative;width:150px;height:150px;">
          <svg width="150" height="150" viewBox="0 0 150 150" style="transform:rotate(-90deg);">
            <circle cx="75" cy="75" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="11"/>
            <circle cx="75" cy="75" r="${r}" fill="none" stroke="#1A7AB5" stroke-width="11"
              stroke-linecap="round" stroke-dasharray="${circ}"
              stroke-dashoffset="${circ - circ * usados / total}"/>
          </svg>
          <div style="position:absolute;inset:0;display:flex;flex-direction:column;
                      align-items:center;justify-content:center;">
            <span style="font-size:42px;font-weight:700;line-height:1;">${usados}</span>
            <span style="font-size:12px;color:rgba(255,255,255,0.45);margin-top:3px;">días usados</span>
          </div>
        </div>
        <div class="pastilla" style="background:rgba(239,159,39,0.2);color:#FAC775;margin-top:10px;padding:6px 16px;">
          Te quedan ${total - usados} días</div>
      </div>
      <div style="display:flex;gap:9px;padding:18px 16px 0;">
        <button class="btn">✅ Estrené un par</button>
        <button class="btn" style="background:rgba(226,75,74,0.16);color:#F09595;">🗑️ Ya me deshice</button>
      </div>`;
  },

  estudio(){
    const totalH = TEMAS_EST.reduce((a,t)=>a+horasTema(t), 0);
    const totalM = TEMAS_EST.reduce((a,t)=>a+metaTema(t), 0);
    const listos = sorteables().length;
    const vs = VENTAJA_SEM, vg = VENTAJA_GEN;
    const col = v => v >= 0 ? '#5DCAA5' : '#FAC775';
    const sig = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1);
    return cabecera('Mi Estudio', 'horas por tema', 'inicio', '📚', MODULOS.estudio.color) + `
      <div class="cifras">
        <div class="cifra"><div class="cifra-num" style="color:#F07AB0;">47.6</div>
          <div class="cifra-lbl">h esta semana</div></div>
        <div class="cifra"><div class="cifra-num" style="color:${col(vs)};">${sig(vs)}</div>
          <div class="cifra-lbl">ventaja esta semana</div></div>
        <div class="cifra"><div class="cifra-num" style="color:${col(vg)};">${sig(vg)}</div>
          <div class="cifra-lbl">ventaja general</div></div>
      </div>
      <div style="text-align:center;font-size:13.5px;font-weight:600;color:#F07AB0;padding:14px 20px 0;">
        ${hs(totalH)} de ${hs(totalM)} · ${Math.round(totalH/totalM*100)}% del plan
      </div>

      <div class="seccion">Cronómetro</div>
      ${crono && crono.modulo === 'estudio' ? relojHTML() : `
        <div class="crono" style="background:rgba(214,71,143,0.08);border-color:rgba(214,71,143,0.22);">
          <div class="crono-que" style="margin:0;">${crono
            ? 'Ahora corre <b>' + esc(crono.etiqueta) + '</b>. Arrancar un tema lo reemplaza.'
            : 'Elegí un tema para arrancar'}</div>
        </div>`}
      <div class="chips" style="padding-top:12px;">
        ${TEMAS_EST.slice(0,4).map(t=>`<button class="chip"
          onclick="arrancar('estudio','${t.n} › General','${t.color}')">▶ ${t.n}</button>`).join('')}
        <button class="chip" onclick="ir('estudio/temas')">···</button>
      </div>

      <div class="seccion">Subtema al azar</div>
      <button class="tarjeta" style="margin:0 16px;width:calc(100% - 32px);
              background:rgba(214,71,143,0.1);border-color:rgba(214,71,143,0.28);"
              onclick="ir('estudio/ruleta')">
        <div class="icono" style="background:rgba(214,71,143,0.2);">🎲</div>
        <div class="tarjeta-txt"><div class="tarjeta-tit">Sortear algo para repasar</div>
          <div class="tarjeta-sub">${listos} cosas pasaron el 90% y están listas para evaluar</div></div>
        <span class="tarjeta-flecha">›</span>
      </button>

      <div class="seccion">Por tema (${TEMAS_EST.length})</div>
      <div class="tarjetas">` + TEMAS_EST.map(t=>{
        const h = horasTema(t), m = metaTema(t);
        const listosT = t.bloques.reduce((a,b)=>a + b.subs.filter(cumplido).length, 0);
        const subsT = t.bloques.reduce((a,b)=>a + b.subs.length, 0);
        return `<button class="tarjeta" onclick="verTema('${t.n}')">
          <div class="icono" style="background:${t.color}33;color:${t.color};font-size:15px;font-weight:700;">
            ${Math.round(h/m*100)}%</div>
          <div class="tarjeta-txt">
            <div class="tarjeta-tit">${t.n}</div>
            <div class="tarjeta-sub">${hs(h)} de ${hs(m)} · ${listosT}/${subsT} listos ·
              meta ${t.metaSem} h/sem</div>
            ${barra(h, m, t.color)}
          </div>
          <span class="tarjeta-flecha">›</span>
        </button>`;
      }).join('') + `</div>
      <div style="padding:16px;"><button class="btn" onclick="ir('estudio/registrar')">➕ Registrar a mano</button></div>
      <div class="nota">Ocho temas no entran en una pantalla sin barrer. Con menús, además,
        esto vive dentro de un acordeón que ya está dentro de otro. <b>Fijate si acá se te
        hace más fácil llegar a un subtema concreto</b>, que es lo que hacés todo el día.</div>
    `;
  },

  'estudio/temas'(){
    return cabecera('Todos los temas', 'para el cronómetro', 'estudio') + `
      <div class="tarjetas">` + TEMAS_EST.map(t=>`
        <button class="tarjeta" onclick="verTema('${t.n}')">
          <div class="icono" style="background:${t.color}33;"></div>
          <div class="tarjeta-txt"><div class="tarjeta-tit">${t.n}</div>
            <div class="tarjeta-sub">meta ${t.metaSem} h por semana · ${hs(t.hechoSem)} esta semana</div></div>
          <span class="tarjeta-flecha">›</span>
        </button>`).join('') + `</div>`;
  },

  'estudio/tema'(){
    const t = estTema || TEMAS_EST[0];
    const ti = TEMAS_EST.indexOf(t);
    const h = horasTema(t), m = metaTema(t);
    return cabecera(t.n, `${hs(h)} de ${hs(m)} · meta ${t.metaSem} h/sem`, 'estudio') + `
      <div style="padding:0 16px 4px;">${barra(h, m, t.color)}</div>
      <div class="seccion">Bloques</div>` +
      t.bloques.map((b, bi)=>{
        const abierto = estBloques.has(bi);
        const bh = horasBloque(b), bm = metaBloque(b);
        return `<div class="bloque">
          <button class="bloque-cab" onclick="toggleBloque(${bi})">
            <span class="bloque-n">${b.n}</span>
            <span class="bloque-h">${hs(bh)} / ${hs(bm)}</span>
            <span style="color:rgba(255,255,255,0.35);transform:rotate(${abierto?180:0}deg);">▾</span>
          </button>
          ${abierto ? b.subs.map((sb, si)=>`
            <div class="sub" onclick="verSub(${ti},${bi},${si})">
              <div class="sub-n">
                ${sb.n}${cumplido(sb) ? ' <span class="listo">✓</span>' : ''}
                ${barra(sb.hecho, sb.meta, t.color)}
              </div>
              <span class="sub-h">${hs(sb.hecho)} / ${hs(sb.meta)}${exceso(sb.hecho, sb.meta)}</span>
              <button class="mini" onclick="event.stopPropagation();" title="Iniciar cronómetro">▶</button>
              <button class="mini" onclick="event.stopPropagation();ir('estudio/registrar');" title="Registrar aquí">➕</button>
            </div>`).join('') : ''}
        </div>`;
      }).join('') + `
      <div class="nota">El ✓ marca lo que pasó el 90% y ya puede salir sorteado.
        La barra verde al final de algunas es <b>el exceso sobre la meta</b>, no un error.</div>`;
  },

  'estudio/subtema'(){
    const t = estTema || TEMAS_EST[0];
    const sb = estSub || t.bloques[0].subs[0];
    const pct = Math.round(sb.hecho / sb.meta * 100);
    const ses = [['hoy','1h 20'],['11 de sep','45 min'],['8 de sep','2h 10'],['5 de sep','1h 05']];
    return cabecera(sb.n, t.n, 'estudio/tema') + `
      <div class="cifras">
        <div class="cifra"><div class="cifra-num" style="color:${t.color};">${pct}%</div>
          <div class="cifra-lbl">de la meta</div></div>
        <div class="cifra"><div class="cifra-num">${hs(sb.hecho)}</div>
          <div class="cifra-lbl">estudiado</div></div>
        <div class="cifra"><div class="cifra-num" style="color:rgba(255,255,255,0.5);">${hs(sb.meta)}</div>
          <div class="cifra-lbl">meta</div></div>
      </div>
      <div style="padding:14px 16px 0;">${barra(sb.hecho, sb.meta, t.color)}</div>
      <div style="display:flex;gap:9px;padding:16px;">
        <button class="btn" style="background:${t.color};color:#fff;"
          onclick="arrancarSub()">▶ Estudiar esto</button>
        <button class="btn" onclick="ir('estudio/registrar')">➕ Registrar</button>
      </div>

      <div class="seccion">✂️ Puntos de repaso (${sb.puntos.length})</div>
      ${sb.puntos.length ? `<div class="filas">` + sb.puntos.map(pt=>`
        <div class="fila"><span style="color:${t.color};">◆</span>
          <div class="fila-txt">${pt}</div>
          <button class="mini" title="Quitar">🗑</button></div>`).join('') + `</div>` : `
        <div class="vacio">Sin puntos todavía.<br>Partir el subtema en trozos concretos
          hace que el sorteo sea más específico.</div>`}
      <div style="padding:14px 16px 0;">
        <button class="btn" onclick="ir('estudio/puntos')">✂️ Editar los puntos</button>
      </div>

      <div class="seccion">Sesiones</div>
      <div class="filas">` + ses.map(([f,d])=>`
        <div class="fila"><span style="color:rgba(255,255,255,0.35);font-size:12px;">${f}</span>
          <div class="fila-txt"></div>
          <span style="color:rgba(255,255,255,0.6);font-size:13px;">${d}</span>
          <button class="mini" title="Editar">✏️</button></div>`).join('') + `</div>
      <div class="nota">Esto hoy es <b>un acordeón dentro de un acordeón dentro de otro</b>:
        tema → subtema → sesiones. Acá cada nivel es una pantalla y el Atrás te devuelve
        exactamente un paso.</div>`;
  },

  'estudio/puntos'(){
    const t = estTema || TEMAS_EST[0];
    const sb = estSub || t.bloques[0].subs[0];
    return cabecera('✂️ Puntos de repaso', sb.n, 'estudio/subtema') + `
      <div class="nota" style="margin-top:0;">Un punto por línea. Son los trozos concretos
        que el sorteo puede pedirte, en vez del subtema entero.</div>
      <div style="padding:16px;">
        <textarea style="width:100%;min-height:170px;padding:13px;font-size:14px;line-height:1.6;
          border:1px solid rgba(255,255,255,0.15);border-radius:12px;background:rgba(255,255,255,0.06);
          color:#fff;font-family:inherit;resize:vertical;">${sb.puntos.join('\n')}</textarea>
        <div style="display:flex;gap:9px;margin-top:12px;">
          <button class="btn" onclick="ir('estudio/subtema', true)">Cancelar</button>
          <button class="btn" style="background:#D6478F;" onclick="ir('estudio/subtema', true)">Guardar</button>
        </div>
      </div>`;
  },

  'estudio/ruleta'(){
    const c = sorteables();
    const x = estSorteado;
    let cuerpo;
    if(!c.length){
      cuerpo = `<div class="vacio">Ningún subtema pasó el 90% de su meta todavía.</div>`;
    } else if(!x){
      cuerpo = `<div class="vacio">Tocá el dado: hay ${c.length} cosas listas para evaluar.</div>`;
    } else {
      const pct = Math.round(x.s.hecho / x.s.meta * 100);
      cuerpo = `<div class="ruleta">
        <div style="font-size:12px;font-weight:600;color:${x.t.color};">${x.t.n} · ${x.b.n}</div>
        ${x.punto
          ? `<div class="ruleta-pto">${x.punto}</div>
             <div style="font-size:12px;color:rgba(255,255,255,0.4);">de ${x.s.n}</div>`
          : `<div class="ruleta-pto">${x.s.n}</div>`}
        <div style="font-size:12px;color:rgba(255,255,255,0.45);margin-top:8px;">
          ${hs(x.s.hecho)} de ${hs(x.s.meta)} · ${pct}%</div>
        <div class="crono-btns">
          <button class="btn" style="background:${x.t.color};color:#fff;">▶ Repasar</button>
          <button class="btn" onclick="sortear()">🎲 Otro</button>
        </div>
      </div>`;
    }
    return cabecera('Subtema al azar', `${c.length} listos para evaluar`, 'estudio') + `
      <div style="padding:0 16px 16px;">
        <button class="btn" style="background:#D6478F;" onclick="sortear()"${c.length?'':' disabled'}>
          🎲 Sortear</button>
      </div>
      ${cuerpo}
      <div class="nota">Solo entra lo que pasó el <b>90% de su meta</b>: no tiene sentido
        autoevaluarte de algo que todavía no estudiaste. Si el subtema tiene puntos cargados,
        te sortea un punto concreto; si no, el subtema entero.</div>`;
  },

  'estudio/registrar'(){
    return cabecera('Registrar a mano', 'una sesión ya hecha', 'estudio') + `
      <div style="padding:6px 16px 0;">
        <div style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:8px;">Tema</div>
      </div>
      <div class="chips">${TEMAS_EST.map((t,i)=>`<button class="chip"
        style="${i===0?`background:${t.color}33;border-color:${t.color};color:#fff;`:''}">${t.n}</button>`).join('')}</div>
      <div style="padding:18px 16px 0;">
        <div style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:8px;">Subtema</div>
        <input placeholder="Ej: Garde à vue et droits de la défense"
          style="width:100%;padding:12px 14px;font-size:14px;border:1px solid rgba(255,255,255,0.15);
          border-radius:12px;background:rgba(255,255,255,0.06);color:#fff;font-family:inherit;">
        <div style="display:flex;gap:10px;margin-top:14px;">
          <div style="flex:1;">
            <div style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:8px;">Horas</div>
            <input type="number" placeholder="1" style="width:100%;padding:12px 14px;font-size:14px;
              border:1px solid rgba(255,255,255,0.15);border-radius:12px;
              background:rgba(255,255,255,0.06);color:#fff;font-family:inherit;"></div>
          <div style="flex:1;">
            <div style="font-size:12px;color:rgba(255,255,255,0.45);margin-bottom:8px;">Minutos</div>
            <input type="number" placeholder="30" style="width:100%;padding:12px 14px;font-size:14px;
              border:1px solid rgba(255,255,255,0.15);border-radius:12px;
              background:rgba(255,255,255,0.06);color:#fff;font-family:inherit;"></div>
        </div>
        <div style="display:flex;gap:9px;margin-top:18px;">
          <button class="btn" onclick="ir('estudio', true)">Cancelar</button>
          <button class="btn" style="background:#D6478F;" onclick="ir('estudio', true)">Guardar</button>
        </div>
      </div>
      <div class="nota">Acá va una diferencia de fondo: hoy esto es una <b>ventana emergente</b>.
        Como pantalla, el Atrás del teléfono la cierra sola y no tapa lo que estabas viendo.</div>`;
  },

  ropa(){
    return cabecera('Mi Ropa', 'qué ponerte', volverDe('ropa'), '👖', MODULOS.ropa.color) +
      `<div class="vacio">Pantalla de relleno.<br>El prototipo se concentra en la navegación,
        no en cada módulo.</div>`;
  },

  mas(){
    const resumen = { carnes:'El pollo vence mañana', gym:'Fuiste hoy · 3 veces esta semana',
                      lentes:'Cambiá en 6 días', compras:'5 cosas por comprar', ropa:null };
    return cabecera('Más', 'el resto de los módulos', 'inicio') + `
      <div class="tarjetas">
        ${EN_MAS.map(m=>tarjetaModulo(m, resumen[m])).join('')}
      </div>
      <div class="nota">Abajo quedaron Hoy, Tiempo y Estudio porque son fijos, y
        <b>${MODULOS[POPULAR].nombre}</b> porque es el más usado del resto
        (${USO[POPULAR]} min contra ${USO[EN_MAS[0]]} del siguiente). Nadie eligió eso a mano:
        lo decide <code>uso_modulos</code>, y cambia solo si cambiás vos.</div>
    `;
  },
};

// ---- Navegacion: el hash es la pantalla, y el boton Atras sale gratis ----
let anterior = '';
function ir(ruta, atras){
  if (atras) yendoAtras = true;
  location.hash = '#/' + ruta;
}
let yendoAtras = false;

function pintar(){
  const ruta = (location.hash.replace(/^#\//, '') || 'inicio');
  const dibujo = PANTALLAS[ruta] || PANTALLAS.inicio;
  const vista = document.getElementById('vista');
  vista.innerHTML = `<div class="pantalla${yendoAtras ? ' atras' : ''}">${dibujo()}</div>`;
  yendoAtras = false;
  anterior = ruta;
  window.scrollTo(0, 0);
  pintarTabs(ruta);
}

function pintarTabs(ruta){
  const raiz = ruta.split('/')[0];
  // 'Más' se queda encendido mientras estés en cualquiera de los módulos que contiene.
  const dentroDeMas = EN_MAS.includes(raiz);
  document.getElementById('tabs').innerHTML = BARRA.map(t=>{
    const ico = t === 'inicio' ? '🏠' : t === 'mas' ? '⋯' : MODULOS[t].ico;
    const lbl = CORTO[t];
    const on = (t === raiz) || (t === 'mas' && dentroDeMas);
    const aviso = t === 'compras' ? '<i class="tab-punto"></i>' : '';
    return `<button class="tab${on ? ' on' : ''}" onclick="ir('${t}')">
      <span class="tab-ico">${ico}</span>${aviso}<span class="tab-lbl">${lbl}</span></button>`;
  }).join('');
}

addEventListener('hashchange', pintar);
pintar();

// Los relojes corriendo: sin esto la pantalla parece una foto, y lo que hay que
// evaluar es justamente si se siente viva. Se tocan los nodos directo en vez de
// redibujar la pantalla entera cada segundo.
setInterval(()=>{
  if (crono) {
    crono.seg++;
    const el = document.getElementById('reloj');
    if (el) el.textContent = hhmmss(crono.seg);
  }
  if (viaje) {
    viaje.seg++;
    const el = document.getElementById('reloj-viaje');
    if (el) el.textContent = hhmmss(viaje.seg);
  }
}, 1000);
</script>
